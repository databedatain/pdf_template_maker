<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Template Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="brand">PDF Template Maker</span>
    <span class="formname" id="formName">no form loaded</span>
    <span class="spacer"></span>
    <button class="btn" id="btnImport">Import export…</button>
    <button class="btn" id="btnLoadLayout">Open layout…</button>
    <button class="btn" id="btnSaveLayout" disabled>Save layout</button>
    <button class="btn" id="btnNames" disabled>Name list</button>
    <button class="btn primary" id="btnPdf" disabled>Export PDF</button>
  </div>

  <div id="main">

    <div class="pane" id="outline">
      <div class="pane-head">
        <span>Form items</span>
        <span class="spacer"></span>
        <button class="btn sm ghost" id="btnAllOn" title="Include every item">all</button>
        <button class="btn sm ghost" id="btnAllOff" title="Exclude every item">none</button>
        <button class="btn sm ghost" id="btnRepair" title="Restore commas the Credible export stripped">commas</button>
        <button class="btn sm" id="btnAdd" title="Add a heading, note or gap of your own">+</button>
      </div>
      <div class="pane-body" id="blockList"></div>
    </div>

    <div class="pane" id="canvasPane">
      <div id="pages"></div>
      <div id="zoombar">
        <button class="btn sm" id="zOut">&minus;</button>
        <span class="z" id="zVal">100%</span>
        <button class="btn sm" id="zIn">+</button>
        <button class="btn sm" id="zFit">fit</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim)">
          <input type="checkbox" id="showNames"> all names
        </label>
      </div>
    </div>

    <div class="pane" id="inspector">
      <div id="inspGrip" title="Drag to resize"></div>
      <div class="pane-head"><span id="inspTitle">Document</span></div>
      <div class="pane-body" id="inspBody"></div>
    </div>

  </div>

  <div id="warnbar">
    <div class="wh">
      <span>Checks</span>
      <span class="badge" id="warnCount">0</span>
      <span class="spacer" style="flex:1"></span>
      <span id="fieldCount" class="badge">0 fields</span>
    </div>
    <div id="warnList"></div>
  </div>

</div>

<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script src="js/metrics.js"></script>
<script src="js/csv.js"></script>
<script src="js/model.js"></script>
<script src="js/layout.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
